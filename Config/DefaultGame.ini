; ---------------------------------------------------------------------------
; 强制把「非默认关卡」也打进包里
;
; 为什么必须写：Cook 只会顺着**资产引用**去收集东西，而切换关卡用的是
; `Open Level (by Name)`，关卡名在蓝图里只是一串**字符串（FName）**，
; Cook 解析不到 → 那些关卡不会被打进包 → 打包后一点就"打不开/找不到地图"。
;
; 只有 `GameDefaultMap` 指定的那个关卡（现在 = /Game/map/start）会自动 Cook。
;
; 所以：**每新增一个需要用 Open Level 跳过去的关卡，就在这里加一行。**
; 路径不带 .umap 扩展名。
; ---------------------------------------------------------------------------
+MapsToCook=(FilePath="/Game/map/baseBox")

; ---------------------------------------------------------------------------
; Asset Manager 的资产扫描规则
;
; 不加这一段，**打包（Cook）会直接失败**：
;   Error: LogGameFeatures: Asset manager settings do not include a rule for
;          assets of type GameFeatureData
;   Error: LoadErrors: 资产管理器设置不包含类型为GameFeatureData的资产的条目
;   → Cook failed (ExitCode=25 Error_UnknownCookFailure)
;
; 原因：GameFeatures 插件（引擎默认启用）在 Cook 时会要求 AssetManager 里
; 必须有 GameFeatureData 这个类型的扫描规则。项目本来没有
; `[/Script/Engine.AssetManagerSettings]` 段，所以就报了这个错。
;
; 下面三条是 UE 的标准写法（前两条是引擎 BaseGame.ini 里的默认值，
; 第三条补上 GameFeatureData）。项目不用 GameFeatures 也没关系 ——
; 规则指向的 `/Game/GameFeatures` 目录不存在，扫描时自然为空。
; ---------------------------------------------------------------------------
[/Script/Engine.AssetManagerSettings]

+PrimaryAssetTypesToScan=(PrimaryAssetType="Map",AssetBaseClass=/Script/Engine.World,bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/map")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="PrimaryAssetLabel",AssetBaseClass=/Script/Engine.PrimaryAssetLabel,bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass=/Script/GameFeatures.GameFeatureData,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/GameFeatures")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

